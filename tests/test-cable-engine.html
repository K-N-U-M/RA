<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>⚡ Suite de Verificación de RACableEngine (Trazado Ortogonal 3D y Sombras AAA)</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0B1120;
      color: #E2E8F0;
      padding: 24px;
      line-height: 1.5;
    }
    h1 {
      color: #38BDF8;
      font-size: 20px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      color: #94A3B8;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .badge-pass {
      background: rgba(16, 185, 129, 0.2);
      color: #34D399;
      border: 1px solid #10B981;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.2);
      color: #F87171;
      border: 1px solid #EF4444;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .summary {
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
  <!-- Dependencias mínimas para test de unidad sin visor completo -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
  <script src="../js/cable-engine.js"></script>
</head>
<body>

  <h1>⚡ Suite de Verificación: RACableEngine v3.0</h1>
  <div class="subtitle">Validación matemática y gráfica del Motor 3D de Cableado Ortogonal, Geometría Volumétrica y Sombras REBT.</div>

  <div class="card">
    <h3 style="margin-top:0; color:#F59E0B; font-size:14px;">BATERÍA DE PRUEBAS DE INGENIERÍA 3D</h3>
    <div id="test-results">Ejecutando pruebas...</div>
    <div id="test-summary" class="summary"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const resultsContainer = document.getElementById('test-results');
      const summaryContainer = document.getElementById('test-summary');
      const tests = [];

      function runTest(name, fn) {
        try {
          const pass = fn();
          tests.push({ name: name, pass: !!pass });
        } catch (e) {
          tests.push({ name: name, pass: false, error: e.message });
        }
      }

      // Test 1: Carga y presencia del módulo
      runTest('1. Módulo RACableEngine exportado en window y namespace RA', function () {
        return window.RACableEngine && window.RA && window.RA.CableEngine === window.RACableEngine;
      });

      // Test 2: Perfiles 2D extruidos
      runTest('2. Perfil 2D circular de tubo y perfil rectangular de bandeja', function () {
        const circle = RACableEngine.getCircleProfile(0.018, 10);
        const tray = RACableEngine.getTrayProfile(0.08, 0.03);
        return Array.isArray(circle) && circle.length === 10 && Array.isArray(tray) && tray.length === 8;
      });

      // Test 3: Despegues normalizados (+0.35m y +0.45m)
      runTest('3. Cotas exactas de despegue sobre faldón (+0.35m DC+ y +0.45m DC-)', function () {
        const p0 = new Cesium.Cartesian3(100, 200, 300);
        const norm = new Cesium.Cartesian3(0, 0, 1);
        const pPos = RACableEngine.elevatePoint(p0, 0.35, norm);
        const pNeg = RACableEngine.elevatePoint(p0, 0.45, norm);
        return Math.abs(pPos.z - 300.35) < 0.001 && Math.abs(pNeg.z - 300.45) < 0.001;
      });

      // Test 4: Trazado Ortogonal Manhattan 90°
      runTest('4. Trazado Manhattan 3D genera quiebros a 90° sin curvas catenarias', function () {
        const pA = new Cesium.Cartesian3(10, 10, 5);
        const pB = new Cesium.Cartesian3(25, 30, 0); // Desnivel vertical hacia inversor
        const path = RACableEngine.buildOrthogonalManhattanPath3D(pA, pB, { normalOffset: 0.35 });
        return Array.isArray(path) && path.length >= 3;
      });

      // Test 5: Sanitización de puntos colapsados (< 1.5 cm)
      runTest('5. Sanitización preventiva de vértices duplicados o colapsados (< 1.5 cm)', function () {
        const pts = [
          new Cesium.Cartesian3(0, 0, 0),
          new Cesium.Cartesian3(0, 0, 0.005), // Solo 5 mm
          new Cesium.Cartesian3(2, 0, 0)
        ];
        const clean = RACableEngine.sanitizePositions(pts);
        return clean.length === 2;
      });

      // Test 6: Auto-tests internos de RACableEngine
      runTest('6. Ejecución de suite de auto-diagnóstico interno RACableEngine.runSelfTests()', function () {
        const r = RACableEngine.runSelfTests();
        return r && r.failed === 0 && r.passed >= 4;
      });

      // Render de resultados en pantalla
      let passedCount = 0;
      let html = '';
      tests.forEach(function (t) {
        if (t.pass) passedCount++;
        html += '<div class="test-item">' +
          '<span>' + t.name + (t.error ? ' <small style="color:#F87171;">(' + t.error + ')</small>' : '') + '</span>' +
          '<span class="' + (t.pass ? 'badge-pass' : 'badge-fail') + '">' + (t.pass ? 'PASS' : 'FAIL') + '</span>' +
          '</div>';
      });

      resultsContainer.innerHTML = html;
      summaryContainer.innerHTML = (passedCount === tests.length)
        ? '<span style="color:#10B981;">✔ TODOS LOS TESTS SUPERADOS (' + passedCount + '/' + tests.length + ') — Motor 3D de cableado verificado con éxito.</span>'
        : '<span style="color:#EF4444;">✖ ALGUNOS TESTS HAN FALLADO (' + passedCount + '/' + tests.length + ')</span>';
    });
  </script>
</body>
</html>
