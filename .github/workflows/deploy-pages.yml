name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate js/ra-env.js from Secrets
        env:
          RA_GOOGLE_MAPS_KEY: ${{ secrets.RA_GOOGLE_MAPS_KEY }}
          RA_CESIUM_ION_TOKEN: ${{ secrets.RA_CESIUM_ION_TOKEN }}
          RA_FIREBASE_API_KEY: ${{ secrets.RA_FIREBASE_API_KEY }}
          RA_FIREBASE_AUTH_DOMAIN: ${{ secrets.RA_FIREBASE_AUTH_DOMAIN }}
          RA_FIREBASE_PROJECT_ID: ${{ secrets.RA_FIREBASE_PROJECT_ID }}
          RA_FIREBASE_STORAGE_BUCKET: ${{ secrets.RA_FIREBASE_STORAGE_BUCKET }}
          RA_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RA_FIREBASE_MESSAGING_SENDER_ID }}
          RA_FIREBASE_APP_ID: ${{ secrets.RA_FIREBASE_APP_ID }}
        run: |
          node -e '
            const env = {
              googleMaps: process.env.RA_GOOGLE_MAPS_KEY || "",
              cesiumIon: process.env.RA_CESIUM_ION_TOKEN || "",
              firebase: {
                apiKey: process.env.RA_FIREBASE_API_KEY || "",
                authDomain: process.env.RA_FIREBASE_AUTH_DOMAIN || "",
                projectId: process.env.RA_FIREBASE_PROJECT_ID || "",
                storageBucket: process.env.RA_FIREBASE_STORAGE_BUCKET || "",
                messagingSenderId: process.env.RA_FIREBASE_MESSAGING_SENDER_ID || "",
                appId: process.env.RA_FIREBASE_APP_ID || ""
              }
            };
            require("fs").writeFileSync("js/ra-env.js", "window.RA_ENV = " + JSON.stringify(env, null, 2) + ";\n");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
